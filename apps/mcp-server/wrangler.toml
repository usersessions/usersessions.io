name = "usersessions-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects binding — required by the Agents SDK's McpAgent,
# which uses a Durable Object per active MCP session.
[[durable_objects.bindings]]
name = "USERSESSIONS_MCP"
class_name = "UserSessionsMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSessionsMCP"]

# Secrets — set these with `wrangler secret put <NAME>`, never commit real values:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
